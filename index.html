<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8F7F4" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ttsp-folio-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#1E1E1E' : '#F8F7F4');
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="THE TTSP FOLIO. A digital literary and visual arts exhibition of The Technologian Student Press."
    />
    <title>The TTSP Folio</title>
    <link rel="icon" type="image/png" href="/ttsp-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.cdnfonts.com/css/bl-melody"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
